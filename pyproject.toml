[project]
name = "opportunity-engine"
version = "0.1.0"
description = "Personal opportunity discovery pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0",
]

[project.scripts]
oe = "opportunity_engine.cli:app"
api = "api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
